[project]
name = "ov-adapter"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["qdrant-client>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
